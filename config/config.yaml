data_manager:
  data_folder: './data/'
  raw_data_name: 'WA_Fn-UseC_-Telco-Customer-Churn.csv'

pipeline_runner:
  model_path: 'models/prod/latest_model'
  test_size: 0.20
  random_state: 42
  upsample: true

preprocessing:
  target_column: 'Churn'
  drop_columns: ['customerID']
  target_mapping:
    'Yes': 1
    'No': 0

feature_engineering:
  # LabelEncoder is applied to all remaining object (categorical) columns

training:
  loss_function: 'Logloss'
  eval_metric: 'F1'
  iterations: 1000
  early_stopping_rounds: 100
  verbose: 0
  random_seed: 42
  n_cv_splits: 5

  optuna:
    n_trials: 50
    search_space:
      learning_rate:
        low: 0.01
        high: 0.2
      depth:
        low: 3
        high: 8
      l2_leaf_reg:
        low: 0.5
        high: 5.0
