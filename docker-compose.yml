version: '3.8'

services:

  # ===========================================================================
  # TRAINING SERVICE
  # Runs once: preprocesses data, tunes hyperparameters, saves model to volume
  # ===========================================================================
  app-ml-train:
    build:
      context: .
      dockerfile: app-ml/Dockerfile
    command: ["python", "app-ml/entrypoint/train.py"]
    restart: "no"
    volumes:
      - ./data:/app/data        # Training data
      - ./config:/app/config    # Pipeline config
      - ./models:/app/models    # Trained model output

  # ===========================================================================
  # UI SERVICE
  # Waits for the trained model, then serves the Dash dashboard on port 8050
  # ===========================================================================
  app-ui:
    build:
      context: .
      dockerfile: app-ui/Dockerfile
    command: >
      sh -c "until [ -f /app/models/prod/latest_model.cbm ];
             do echo 'Waiting for model...'; sleep 5; done
             && gunicorn --chdir /app/app-ui app:server
                --bind 0.0.0.0:8050 --workers 1 --timeout 120"
    ports:
      - "8050:8050"
    volumes:
      - ./data:/app/data
      - ./config:/app/config
      - ./models:/app/models
    depends_on:
      - app-ml-train

# ===========================================================================
# USAGE
#
# Full run (train + serve):
#   docker-compose up --build
#
# Train only:
#   docker-compose run app-ml-train
#
# Serve only (model already trained):
#   docker-compose up app-ui
#
# Stop all:
#   docker-compose down
# ===========================================================================
